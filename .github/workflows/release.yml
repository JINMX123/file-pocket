name: 打包安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # macOS → .dmg / .app
            args: ''
          - platform: windows-latest # Windows → .msi / .exe(NSIS)
            args: ''
          - platform: ubuntu-22.04 # Linux → .deb / AppImage
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev

      - name: 安装前端依赖
        run: npm ci --include=dev

      # 双保险：全局再装一份 tauri CLI，避免 npm ci 偶发不生成 .bin 链接导致 "tauri: not found"
      - name: 安装 tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: 验证构建环境
        run: |
          tauri --version
          cargo --version
          node --version

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: '文件口袋 v__VERSION__'
          releaseBody: 'Windows 下载 .msi / .exe，macOS 下载 .dmg。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
